name: Aave shared reserve risk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
        working-directory: protocol
      - run: forge install foundry-rs/forge-std@v1.9.7 --no-git
        working-directory: protocol
      - run: forge test --match-contract '^BluePoolTest$' -vv
        working-directory: protocol
      - run: pip install -r ai-risk-controller/requirements-dev.lock
      - run: python -m pytest -q
        working-directory: ai-risk-controller
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: frontend
