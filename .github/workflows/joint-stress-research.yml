name: Joint stress research demo
on:
  pull_request:
  push:
    branches: [codex/enforced-risk-parameters]
permissions:
  contents: read
jobs:
  research-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: pip install -r ai-risk-controller/requirements-dev.lock
      - run: python -m pytest -q tests/test_joint_stress.py
        working-directory: ai-risk-controller
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: frontend
