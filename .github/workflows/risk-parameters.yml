name: Risk parameter consistency and enforcement
on:
  pull_request:
  push:
    branches: [main, codex/enforced-risk-parameters]
permissions:
  contents: read
jobs:
  contracts-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pip install -r ai-risk-controller/requirements-dev.lock
      - run: bash scripts/bootstrap_protocol.sh
      - run: python scripts/generate_parameters.py --check
      - run: python scripts/generate_replay_fixture.py --check
      - run: forge build
        working-directory: protocol-old
      - run: python scripts/export_contract_abis.py --check
      - name: Offline contracts, including unchanged canonical Morpho
        run: forge test --no-match-path 'test/fork/*' --no-match-contract 'BlueRouterTest|ScenariosForkTest'
        working-directory: protocol-old
      - run: python -m pytest -q
        working-directory: ai-risk-controller
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
        working-directory: keepers
      - run: pnpm test && pnpm typecheck
        working-directory: keepers
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run typecheck && npm run build
        working-directory: frontend
