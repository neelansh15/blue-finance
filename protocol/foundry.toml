[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../protocol-old/src"]
remappings = [
  "aave/=node_modules/@aave-dao/aave-v3-origin/src/contracts/",
  "openzeppelin-contracts/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
  "morpho-prototype/=../protocol-old/src/"
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
